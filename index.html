<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>5. Sınıf Karma Test</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
    }

    .app {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 16px 50px;
    }

    .header {
        margin-bottom: 26px;
    }

    .header h1 {
        margin: 0 0 7px;
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -0.4px;
    }

    .header p {
        margin: 0;
        color: #777;
        font-size: 14px;
        line-height: 1.5;
    }

    .progress-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
        margin-bottom: 9px;
        color: #888;
        font-size: 13px;
    }

    .progress-track {
        width: 100%;
        height: 5px;
        overflow: hidden;
        background: #1b1b1b;
        border-radius: 50px;
    }

    .progress-bar {
        width: 0%;
        height: 100%;
        background: #fff;
        border-radius: 50px;
        transition: width .3s ease;
    }

    .question-area {
        padding-top: 8px;
    }

    .category {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        margin-bottom: 17px;
        padding: 6px 10px;
        background: #141414;
        border: 1px solid #222;
        border-radius: 8px;
        color: #999;
        font-size: 11px;
        font-weight: 650;
    }

    .question {
        margin: 0 0 25px;
        color: #fff;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.48;
        letter-spacing: -0.2px;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 11px;
    }

    .option {
        width: 100%;
        min-height: 58px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 12px 14px;
        border: 1px solid #252525;
        border-radius: 13px;
        background: #0d0d0d;
        color: #eee;
        text-align: left;
        cursor: pointer;
        font-size: 15px;
        line-height: 1.4;
        transition: background .15s ease, border-color .15s ease;
    }

    .option:not(:disabled):active {
        background: #171717;
        transform: scale(.995);
    }

    .letter {
        width: 34px;
        height: 34px;
        min-width: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: #1c1c1c;
        color: #bbb;
        font-size: 13px;
        font-weight: 750;
    }

    .option.correct {
        border-color: #27c767;
        background: #07140c;
        color: #fff;
    }

    .option.correct .letter {
        background: #27c767;
        color: #000;
    }

    .option.wrong {
        border-color: #ef4444;
        background: #190707;
        color: #fff;
    }

    .option.wrong .letter {
        background: #ef4444;
        color: #fff;
    }

    .option:disabled {
        cursor: default;
    }

    .feedback {
        display: none;
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        line-height: 1.6;
    }

    .feedback.show {
        display: block;
    }

    .feedback.correct-feedback {
        background: #06130b;
        border: 1px solid #155d31;
    }

    .feedback.wrong-feedback {
        background: #170707;
        border: 1px solid #5c1c1c;
    }

    .feedback-title {
        font-size: 17px;
        font-weight: 750;
    }

    .correct-feedback .feedback-title {
        color: #35d87b;
    }

    .wrong-feedback .feedback-title {
        color: #ff6060;
    }

    .correct-answer {
        margin-top: 8px;
        color: #fff;
        font-size: 14px;
        font-weight: 650;
    }

    .explanation {
        margin-top: 9px;
        color: #c4c4c4;
        font-size: 14px;
        line-height: 1.65;
    }

    .next-btn {
        display: none;
        width: 100%;
        min-height: 52px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #fff;
        color: #000;
        font-size: 15px;
        font-weight: 750;
        cursor: pointer;
    }

    .next-btn.show {
        display: block;
    }

    .result {
        display: none;
        text-align: center;
        padding-top: 55px;
    }

    .result-small {
        margin-bottom: 9px;
        color: #737373;
        font-size: 13px;
    }

    .result h2 {
        margin: 0;
        font-size: 31px;
        line-height: 1.25;
        letter-spacing: -0.7px;
    }

    .result-message {
        margin-top: 10px;
        color: #888;
        font-size: 14px;
    }

    .score-circle {
        width: 154px;
        height: 154px;
        margin: 35px auto 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid #292929;
        border-radius: 50%;
        background: #080808;
    }

    .score {
        font-size: 49px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
    }

    .score-label {
        margin-top: 7px;
        color: #777;
        font-size: 11px;
    }

    .result-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 25px;
    }

    .stat {
        padding: 17px 10px;
        border: 1px solid #202020;
        border-radius: 12px;
        background: #0b0b0b;
    }

    .stat strong {
        display: block;
        margin-bottom: 4px;
        font-size: 25px;
    }

    .stat span {
        color: #777;
        font-size: 11px;
    }

    .restart-btn {
        width: 100%;
        min-height: 52px;
        border: none;
        border-radius: 12px;
        background: #fff;
        color: #000;
        font-size: 15px;
        font-weight: 750;
        cursor: pointer;
    }

    @media (max-width: 480px) {
        .app {
            padding: 20px 14px 45px;
        }

        .header h1 {
            font-size: 21px;
        }

        .question {
            font-size: 19px;
        }

        .option {
            min-height: 56px;
            padding: 11px 12px;
            font-size: 14px;
        }

        .result {
            padding-top: 35px;
        }

        .result h2 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <div id="quizScreen">

        <header class="header">
            <h1>5. Sınıf Karma Test</h1>
            <p>Açı • Doğrular • Kuvvet • Kütle ve Ağırlık • Sürtünme</p>

            <div class="progress-info">
                <span id="questionCount">1 / 50</span>
                <span id="correctCount">0 doğru</span>
            </div>

            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </header>

        <main class="question-area">

            <div class="category" id="category"></div>

            <h2 class="question" id="questionText"></h2>

            <div class="options" id="options"></div>

            <div class="feedback" id="feedback"></div>

            <button
                type="button"
                class="next-btn"
                id="nextBtn"
            >
                Sonraki Soru
            </button>

        </main>

    </div>


    <div class="result" id="resultScreen">

        <div class="result-small">TEST TAMAMLANDI</div>

        <h2>Aferin Faik Eren!</h2>

        <div class="result-message" id="resultMessage"></div>

        <div class="score-circle">
            <div class="score" id="finalScore">0</div>
            <div class="score-label">100 ÜZERİNDEN</div>
        </div>

        <div class="result-stats">

            <div class="stat">
                <strong id="finalCorrect">0</strong>
                <span>DOĞRU</span>
            </div>

            <div class="stat">
                <strong id="finalWrong">0</strong>
                <span>YANLIŞ</span>
            </div>

        </div>

        <button
            type="button"
            class="restart-btn"
            id="restartBtn"
        >
            Testi Tekrar Çöz
        </button>

    </div>

</div>

let currentQuestion = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let answered = false;

const letters = ["A", "B", "C", "D"];

const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const questionCount = document.getElementById("questionCount");
const correctCount = document.getElementById("correctCount");
const progressBar = document.getElementById("progressBar");

const category = document.getElementById("category");
const questionText = document.getElementById("questionText");
const optionsContainer = document.getElementById("options");

const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");


function showQuestion() {

    answered = false;

    const current = questions[currentQuestion];

    questionCount.textContent =
        (currentQuestion + 1) + " / " + questions.length;

    correctCount.textContent =
        correctAnswers + " doğru";

    const progress =
        (currentQuestion / questions.length) * 100;

    progressBar.style.width =
        progress + "%";

    category.textContent =
        current.category;

    questionText.textContent =
        current.question;

    optionsContainer.innerHTML = "";

    feedback.className = "feedback";
    feedback.innerHTML = "";

    nextBtn.classList.remove("show");

    current.options.forEach(function(option, index) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "option";

        const letter =
            document.createElement("span");

        letter.className = "letter";
        letter.textContent = letters[index];

        const text =
            document.createElement("span");

        text.textContent = option;

        button.appendChild(letter);
        button.appendChild(text);

        button.addEventListener("click", function() {
            checkAnswer(index);
        });

        optionsContainer.appendChild(button);

    });

}


function checkAnswer(selectedIndex) {

    if (answered) {
        return;
    }

    answered = true;

    const current =
        questions[currentQuestion];

    const buttons =
        optionsContainer.querySelectorAll(".option");

    buttons.forEach(function(button) {
        button.disabled = true;
    });

    if (selectedIndex === current.answer) {

        correctAnswers++;

        buttons[selectedIndex]
            .classList.add("correct");

        feedback.className =
            "feedback show correct-feedback";

        feedback.innerHTML =
            '<div class="feedback-title">DOĞRU ✓</div>';

    } else {

        wrongAnswers++;

        buttons[selectedIndex]
            .classList.add("wrong");

        buttons[current.answer]
            .classList.add("correct");

        feedback.className =
            "feedback show wrong-feedback";

        feedback.innerHTML =
            '<div class="feedback-title">YANLIŞ ✕</div>' +
            '<div class="correct-answer">' +
            'Doğru cevap: ' +
            letters[current.answer] +
            ') ' +
            current.options[current.answer] +
            '</div>' +
            '<div class="explanation">' +
            current.explanation +
            '</div>';

    }

    correctCount.textContent =
        correctAnswers + " doğru";

    nextBtn.textContent =
        currentQuestion === questions.length - 1
        ? "Sonucu Gör"
        : "Sonraki Soru";

    nextBtn.classList.add("show");

}


function goNext() {

    if (!answered) {
        return;
    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showResult();

    }

}


function showResult() {

    progressBar.style.width = "100%";

    const score =
        Math.round(
            (correctAnswers / questions.length) * 100
        );

    quizScreen.style.display = "none";
    resultScreen.style.display = "block";

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("finalCorrect")
        .textContent = correctAnswers;

    document.getElementById("finalWrong")
        .textContent = wrongAnswers;

    const message =
        document.getElementById("resultMessage");

    if (score === 100) {

        message.textContent =
            "Mükemmel! Tüm soruları doğru cevapladın.";

    } else if (score >= 90) {

        message.textContent =
            "Harika bir sonuç çıkardın.";

    } else if (score >= 80) {

        message.textContent =
            "Çok iyi gidiyorsun.";

    } else if (score >= 70) {

        message.textContent =
            "İyi bir sonuç. Birkaç konuyu tekrar edebilirsin.";

    } else if (score >= 50) {

        message.textContent =
            "Güzel başlangıç. Yanlış yaptığın konuları tekrar et.";

    } else {

        message.textContent =
            "Biraz daha çalışıp testi yeniden deneyebilirsin.";

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function restartTest() {

    currentQuestion = 0;
    correctAnswers = 0;
    wrongAnswers = 0;
    answered = false;

    resultScreen.style.display = "none";
    quizScreen.style.display = "block";

    showQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


nextBtn.addEventListener(
    "click",
    goNext
);

restartBtn.addEventListener(
    "click",
    restartTest
);


showQuestion();
