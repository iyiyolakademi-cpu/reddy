<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>5. Sınıf Karma Test</title>

<style>
    *{
        box-sizing:border-box;
        -webkit-tap-highlight-color:transparent;
    }

    :root{
        --bg:#000000;
        --text:#ffffff;
        --muted:#7d7d7d;
        --surface:#0d0d0d;
        --surface2:#141414;
        --border:#252525;
        --button:#ffffff;
        --buttonText:#000000;
        --track:#1b1b1b;
        --goodBg:#06130b;
        --goodBorder:#155d31;
        --good:#35d87b;
        --badBg:#170707;
        --badBorder:#5c1c1c;
        --bad:#ff6060;
    }

    body.light{
        --bg:#f5f6f8;
        --text:#111111;
        --muted:#777777;
        --surface:#ffffff;
        --surface2:#f0f1f3;
        --border:#dddddd;
        --button:#111111;
        --buttonText:#ffffff;
        --track:#dedede;
        --goodBg:#eaf8ef;
        --goodBorder:#a7dfba;
        --good:#168343;
        --badBg:#fff0f0;
        --badBorder:#efb1b1;
        --bad:#c83030;
    }

    html,body{
        margin:0;
        padding:0;
        min-height:100%;
        background:var(--bg);
        color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
        transition:background .2s,color .2s;
    }

    body{
        min-height:100vh;
    }

    .app{
        width:100%;
        max-width:680px;
        margin:0 auto;
        padding:20px 16px 50px;
    }

    .top-row{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
        margin-bottom:24px;
    }

    .title-wrap h1{
        margin:0 0 5px;
        font-size:22px;
        font-weight:760;
        letter-spacing:-.4px;
    }

    .title-wrap p{
        margin:0;
        color:var(--muted);
        font-size:13px;
        line-height:1.45;
    }

    .theme-btn{
        min-width:44px;
        height:44px;
        border:1px solid var(--border);
        background:var(--surface);
        color:var(--text);
        border-radius:12px;
        cursor:pointer;
        font-size:18px;
    }

    .progress-info{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        margin-bottom:9px;
        color:var(--muted);
        font-size:13px;
    }

    .progress-track{
        width:100%;
        height:5px;
        overflow:hidden;
        background:var(--track);
        border-radius:50px;
    }

    .progress-bar{
        width:0%;
        height:100%;
        background:var(--text);
        border-radius:50px;
        transition:width .3s ease;
    }

    .question-area{
        padding-top:24px;
    }

    .category{
        display:inline-flex;
        align-items:center;
        min-height:28px;
        margin-bottom:17px;
        padding:6px 10px;
        background:var(--surface2);
        border:1px solid var(--border);
        border-radius:8px;
        color:var(--muted);
        font-size:11px;
        font-weight:650;
    }

    .question{
        margin:0 0 25px;
        color:var(--text);
        font-size:21px;
        font-weight:650;
        line-height:1.48;
        letter-spacing:-.2px;
    }

    .options{
        display:flex;
        flex-direction:column;
        gap:11px;
    }

    .option{
        width:100%;
        min-height:58px;
        display:flex;
        align-items:center;
        gap:13px;
        padding:12px 14px;
        border:1px solid var(--border);
        border-radius:13px;
        background:var(--surface);
        color:var(--text);
        text-align:left;
        cursor:pointer;
        font-size:15px;
        line-height:1.4;
    }

    .option:not(:disabled):active{
        transform:scale(.995);
    }

    .letter{
        width:34px;
        height:34px;
        min-width:34px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius:9px;
        background:var(--surface2);
        color:var(--muted);
        font-size:13px;
        font-weight:750;
    }

    .option.correct{
        border-color:#27c767;
        background:var(--goodBg);
    }

    .option.correct .letter{
        background:#27c767;
        color:#000;
    }

    .option.wrong{
        border-color:#ef4444;
        background:var(--badBg);
    }

    .option.wrong .letter{
        background:#ef4444;
        color:#fff;
    }

    .option:disabled{
        cursor:default;
    }

    .feedback{
        display:none;
        margin-top:20px;
        padding:16px;
        border-radius:12px;
        line-height:1.6;
    }

    .feedback.show{
        display:block;
    }

    .feedback.correct-feedback{
        background:var(--goodBg);
        border:1px solid var(--goodBorder);
    }

    .feedback.wrong-feedback{
        background:var(--badBg);
        border:1px solid var(--badBorder);
    }

    .feedback-title{
        font-size:17px;
        font-weight:750;
    }

    .correct-feedback .feedback-title{
        color:var(--good);
    }

    .wrong-feedback .feedback-title{
        color:var(--bad);
    }

    .correct-answer{
        margin-top:8px;
        color:var(--text);
        font-size:14px;
        font-weight:650;
    }

    .explanation{
        margin-top:9px;
        color:var(--text);
        opacity:.82;
        font-size:14px;
        line-height:1.65;
    }

    .special-message{
        display:none;
        margin-top:16px;
        padding:14px 15px;
        border-radius:12px;
        background:var(--surface2);
        border:1px solid var(--border);
        color:var(--text);
        font-size:15px;
        font-weight:650;
        line-height:1.5;
    }

    .special-message.show{
        display:block;
    }

    .next-btn{
        display:none;
        width:100%;
        min-height:52px;
        margin-top:20px;
        border:none;
        border-radius:12px;
        background:var(--button);
        color:var(--buttonText);
        font-size:15px;
        font-weight:750;
        cursor:pointer;
    }

    .next-btn.show{
        display:block;
    }

    .result{
        display:none;
        text-align:center;
        padding-top:50px;
    }

    .result-small{
        margin-bottom:9px;
        color:var(--muted);
        font-size:13px;
    }

    .result h2{
        margin:0;
        font-size:31px;
        line-height:1.25;
    }

    .result-message{
        margin-top:10px;
        color:var(--muted);
        font-size:14px;
    }

    .score-circle{
        width:154px;
        height:154px;
        margin:35px auto 28px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        border:1px solid var(--border);
        border-radius:50%;
        background:var(--surface);
    }

    .score{
        font-size:49px;
        font-weight:800;
        line-height:1;
        letter-spacing:-2px;
    }

    .score-label{
        margin-top:7px;
        color:var(--muted);
        font-size:11px;
    }

    .result-stats{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-bottom:25px;
    }

    .stat{
        padding:17px 10px;
        border:1px solid var(--border);
        border-radius:12px;
        background:var(--surface);
    }

    .stat strong{
        display:block;
        margin-bottom:4px;
        font-size:25px;
    }

    .stat span{
        color:var(--muted);
        font-size:11px;
    }

    .restart-btn{
        width:100%;
        min-height:52px;
        border:none;
        border-radius:12px;
        background:var(--button);
        color:var(--buttonText);
        font-size:15px;
        font-weight:750;
        cursor:pointer;
    }

    @media(max-width:480px){
        .app{
            padding:18px 14px 44px;
        }

        .title-wrap h1{
            font-size:20px;
        }

        .question{
            font-size:19px;
        }

        .option{
            min-height:56px;
            padding:11px 12px;
            font-size:14px;
        }

        .result h2{
            font-size:27px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <div id="quizScreen">

        <div class="top-row">
            <div class="title-wrap">
                <h1>5. Sınıf Karma Test</h1>
                <p>Açı • Doğrular • Kuvvet • Kütle ve Ağırlık • Sürtünme</p>
            </div>

            <button type="button" class="theme-btn" id="themeBtn" aria-label="Temayı değiştir">
                ☀
            </button>
        </div>

        <div class="progress-info">
            <span id="questionCount">1 / 50</span>
            <span id="correctCount">0 doğru</span>
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <main class="question-area">

            <div class="category" id="category"></div>

            <h2 class="question" id="questionText"></h2>

            <div class="options" id="options"></div>

            <div class="feedback" id="feedback"></div>

            <div class="special-message" id="specialMessage"></div>

            <button type="button" class="next-btn" id="nextBtn">
                Sonraki Soru
            </button>

        </main>

    </div>

    <div class="result" id="resultScreen">

        <div class="result-small">TEST TAMAMLANDI</div>

        <h2>Aferin Faik Eren!</h2>

        <div class="result-message" id="resultMessage"></div>

        <div class="score-circle">
            <div class="score" id="finalScore">0</div>
            <div class="score-label">100 ÜZERİNDEN</div>
        </div>

        <div class="result-stats">

            <div class="stat">
                <strong id="finalCorrect">0</strong>
                <span>DOĞRU</span>
            </div>

            <div class="stat">
                <strong id="finalWrong">0</strong>
                <span>YANLIŞ</span>
            </div>

        </div>

        <button type="button" class="restart-btn" id="restartBtn">
            Testi Tekrar Çöz
        </button>

    </div>

</div>

let currentQuestion = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let answered = false;
let correctStreak = 0;

const letters = ["A","B","C","D"];

const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");
const questionCount = document.getElementById("questionCount");
const correctCount = document.getElementById("correctCount");
const progressBar = document.getElementById("progressBar");
const category = document.getElementById("category");
const questionText = document.getElementById("questionText");
const optionsContainer = document.getElementById("options");
const feedback = document.getElementById("feedback");
const specialMessage = document.getElementById("specialMessage");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");
const themeBtn = document.getElementById("themeBtn");

function showQuestion(){

    answered = false;

    const current = questions[currentQuestion];

    questionCount.textContent =
        (currentQuestion + 1) + " / " + questions.length;

    correctCount.textContent =
        correctAnswers + " doğru";

    const progress =
        (currentQuestion / questions.length) * 100;

    progressBar.style.width =
        progress + "%";

    category.textContent = current.category;
    questionText.textContent = current.question;

    optionsContainer.innerHTML = "";

    feedback.className = "feedback";
    feedback.innerHTML = "";

    specialMessage.className = "special-message";
    specialMessage.textContent = "";

    if(currentQuestion === 9){
        specialMessage.textContent =
            "Ablan seni çok seviyor, öp onu ❤️";
        specialMessage.classList.add("show");
    }

    nextBtn.classList.remove("show");

    current.options.forEach(function(option,index){

        const button =
            document.createElement("button");

        button.type = "button";
        button.className = "option";

        const letter =
            document.createElement("span");

        letter.className = "letter";
        letter.textContent = letters[index];

        const text =
            document.createElement("span");

        text.textContent = option;

        button.appendChild(letter);
        button.appendChild(text);

        button.addEventListener("click",function(){
            checkAnswer(index);
        });

        optionsContainer.appendChild(button);

    });
}

function checkAnswer(selectedIndex){

    if(answered){
        return;
    }

    answered = true;

    const current =
        questions[currentQuestion];

    const buttons =
        optionsContainer.querySelectorAll(".option");

    buttons.forEach(function(button){
        button.disabled = true;
    });

    if(selectedIndex === current.answer){

        correctAnswers++;
        correctStreak++;

        buttons[selectedIndex]
            .classList.add("correct");

        feedback.className =
            "feedback show correct-feedback";

        feedback.innerHTML =
            '<div class="feedback-title">DOĞRU ✓</div>';

        if(correctStreak % 5 === 0){

            specialMessage.textContent =
                "Aferin abim iyisin! 🔥";

            specialMessage.classList.add("show");
        }

    }else{

        wrongAnswers++;
        correctStreak = 0;

        buttons[selectedIndex]
            .classList.add("wrong");

        buttons[current.answer]
            .classList.add("correct");

        feedback.className =
            "feedback show wrong-feedback";

        feedback.innerHTML =
            '<div class="feedback-title">YANLIŞ ✕</div>' +
            '<div class="correct-answer">' +
            'Doğru cevap: ' +
            letters[current.answer] +
            ') ' +
            current.options[current.answer] +
            '</div>' +
            '<div class="explanation">' +
            current.explanation +
            '</div>';
    }

    correctCount.textContent =
        correctAnswers + " doğru";

    nextBtn.textContent =
        currentQuestion === questions.length - 1
        ? "Sonucu Gör"
        : "Sonraki Soru";

    nextBtn.classList.add("show");
}

function goNext(){

    if(!answered){
        return;
    }

    if(currentQuestion < questions.length - 1){

        currentQuestion++;
        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        showResult();

    }
}

function showResult(){

    progressBar.style.width = "100%";

    const score =
        Math.round(
            (correctAnswers / questions.length) * 100
        );

    quizScreen.style.display = "none";
    resultScreen.style.display = "block";

    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("finalCorrect").textContent =
        correctAnswers;

    document.getElementById("finalWrong").textContent =
        wrongAnswers;

    const message =
        document.getElementById("resultMessage");

    if(score === 100){
        message.textContent =
            "Mükemmel! Tüm soruları doğru cevapladın.";
    }
    else if(score >= 90){
        message.textContent =
            "Harika bir sonuç çıkardın.";
    }
    else if(score >= 80){
        message.textContent =
            "Çok iyi gidiyorsun.";
    }
    else if(score >= 70){
        message.textContent =
            "İyi bir sonuç. Birkaç konuyu tekrar edebilirsin.";
    }
    else if(score >= 50){
        message.textContent =
            "Güzel başlangıç. Yanlış yaptığın konuları tekrar et.";
    }
    else{
        message.textContent =
            "Biraz daha çalışıp testi yeniden deneyebilirsin.";
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function restartTest(){

    currentQuestion = 0;
    correctAnswers = 0;
    wrongAnswers = 0;
    correctStreak = 0;
    answered = false;

    resultScreen.style.display = "none";
    quizScreen.style.display = "block";

    showQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function toggleTheme(){

    document.body.classList.toggle("light");

    const lightMode =
        document.body.classList.contains("light");

    themeBtn.textContent =
        lightMode ? "☾" : "☀";

    document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
            "content",
            lightMode ? "#f5f6f8" : "#000000"
        );
}

nextBtn.addEventListener("click",goNext);
restartBtn.addEventListener("click",restartTest);
themeBtn.addEventListener("click",toggleTheme);

showQuestion();

</script>
