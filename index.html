<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgilime ♡</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #4c1027 0%, #18030d 45%, #050105 100%);
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 30px 20px;
            position: relative;
            z-index: 2;
        }

        .small-title {
            margin-bottom: 20px;
            color: #ffc1d5;
            font-size: 17px;
            letter-spacing: 2px;
        }

        #countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-box {
            width: 90px;
            padding: 18px 8px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
        }

        .time-box span {
            display: block;
            font-size: 31px;
            font-weight: bold;
            color: #ff8fb5;
        }

        .time-box small {
            display: block;
            margin-top: 6px;
            color: #ead5dc;
            font-size: 11px;
            letter-spacing: 1px;
        }

        #messageArea {
            display: none;
        }

        .main-message,
        .love-message {
            opacity: 0;
            transform: translateY(25px);
        }

        .main-message {
            font-size: clamp(28px, 7vw, 52px);
            line-height: 1.3;
            animation: showMessage 1.5s forwards;
        }

        .love-message {
            margin-top: 25px;
            color: #ff8fb5;
            font-size: clamp(25px, 6vw, 43px);
            font-weight: bold;
            animation: showMessage 1.5s 2s forwards;
        }

        .heart {
            margin-top: 30px;
            font-size: 60px;
            opacity: 0;
            animation:
                showMessage 1s 3.5s forwards,
                heartbeat 1.2s 4.5s infinite;
        }

        @keyframes showMessage {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.15);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.15);
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -60px;
            color: rgba(255, 105, 155, 0.65);
            pointer-events: none;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            to {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .time-box {
                width: 72px;
                padding: 15px 5px;
            }

            .time-box span {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section id="waitingArea">
            <p class="small-title">SANA SÖYLEMEK İSTEDİĞİM BİR ŞEY VAR ♡</p>

            <div id="countdown">
                <div class="time-box">
                    <span id="hours">00</span>
                    <small>SAAT</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>DAKİKA</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>SANİYE</small>
                </div>
            </div>
        </section>

        <section id="messageArea">
            <h1 class="main-message">
                Bugün 3. günümüze girdik sevgilim...
            </h1>

            <p class="love-message">
                Seni çok seviyorum.
            </p>

            <div class="heart">♡</div>
        </section>

    </main>

    <script>
        // Mesajın açılacağı tarih: 3 Eylül 2026, saat 00.00
        const targetDate = new Date("2026-09-03T00:00:00+03:00").getTime();

        const waitingArea = document.getElementById("waitingArea");
        const messageArea = document.getElementById("messageArea");

        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");

        let countdownInterval;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                clearInterval(countdownInterval);
                showLoveMessage();
                return;
            }

            const totalHours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor(
                (distance % (1000 * 60 * 60)) / (1000 * 60)
            );
            const seconds = Math.floor(
                (distance % (1000 * 60)) / 1000
            );

            hoursElement.textContent = String(totalHours).padStart(2, "0");
            minutesElement.textContent = String(minutes).padStart(2, "0");
            secondsElement.textContent = String(seconds).padStart(2, "0");
        }

        function showLoveMessage() {
            waitingArea.style.display = "none";
            messageArea.style.display = "block";

            setInterval(createHeart, 350);
        }

        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.textContent = Math.random() > 0.5 ? "♡" : "♥";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 22 + 15 + "px";
            heart.style.animationDuration = Math.random() * 3 + 4 + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
