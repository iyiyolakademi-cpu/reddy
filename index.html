var selected="";
var scrollY=0;
var cats=["Aksiyon", "Animasyon", "Bilim Kurgu", "Biyografi", "Dram", "Fantastik", "Gerilim", "Gizem", "Komedi", "Korku", "Macera", "Müzikal", "Psikolojik", "Romantik", "Savaş", "Suç", "Western"];
function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function el(id){return document.getElementById(id)}
window.iyaRenderCats=function(){
 var counts={};films.forEach(function(f){counts[f.category]=(counts[f.category]||0)+1});
 var h='<button class="iya-chip '+(selected===""?"on":"")+'" onclick="iyaCat(\'\')">Tümü · '+films.length+'</button>';
 cats.forEach(function(c){h+='<button class="iya-chip '+(selected===c?"on":"")+'" onclick="iyaCat(\''+c.replace(/'/g,"\\'")+'\')">'+e(c)+' · '+counts[c]+'</button>'});
 el("iya-cats").innerHTML=h;
};
window.iyaCat=function(c){selected=c;el("iya-list-title").textContent=c||"Tüm Filmler";iyaRenderCats();iyaRender()};
window.iyaToggle=function(){el("iya-panel").classList.toggle("open")};
window.iyaRender=function(){
 var q=el("iya-search").value.toLocaleLowerCase("tr-TR").trim(), r=+el("iya-rating").value, y=+el("iya-year").value;
 var arr=films.filter(function(f){
  var hay=(f.name+" "+f.original+" "+f.director+" "+f.stars+" "+f.category).toLocaleLowerCase("tr-TR");
  return (!selected||f.category===selected)&&(!q||hay.indexOf(q)>-1)&&f.rating>=r&&(!y||f.year>=y);
 });
 el("iya-count").textContent=arr.length+" film";
 el("iya-empty").style.display=arr.length?"none":"block";
 el("iya-list").innerHTML=arr.map(function(f){
 return '<button class="iya-card" onclick="iyaOpen('+f.id+')"><span class="iya-meta"><span class="iya-name">'+e(f.name)+'</span><span class="iya-original">'+e(f.original)+'</span><span class="iya-badges"><span class="iya-badge iya-star">★ '+f.rating.toFixed(1)+'</span><span class="iya-badge">'+e(f.category)+'</span><span class="iya-badge">'+f.year+'</span></span></span><span class="iya-arrow">›</span></button>';
 }).join("");
};
window.iyaOpen=function(id){
 var f=films.find(function(x){return x.id===id});if(!f)return;
 scrollY=window.pageYOffset||0;
 el("iya-back-title").textContent=f.name;
 el("iya-detail-content").innerHTML=
 '<div class="iya-title">'+e(f.name)+' ('+f.original+') ('+f.year+')</div>'+
 '<p>'+e(f.intro)+'</p>'+
 '<div class="iya-section-title">IMDb Puanı:</div><p class="iya-star">★ '+f.rating.toFixed(1)+' / 10</p>'+
 '<div class="iya-section-title">Kısaca Bilgi:</div>'+
 '<ul><li><strong>Yönetmen:</strong> '+e(f.director)+'</li><li><strong>Senaryo:</strong> '+e(f.writer)+'</li><li><strong>Başroller:</strong> '+e(f.stars)+'</li><li><strong>Tür:</strong> '+e(f.category)+'</li><li><strong>Yapım Yılı:</strong> '+f.year+'</li></ul>'+
 '<div class="iya-section-title">Konusu:</div><p>'+e(f.subject)+'</p>'+
 '<div class="iya-section-title">Özet:</div><p>'+e(f.summary)+'</p>';
 el("iya-home").style.display="none";el("iya-detail").style.display="block";window.scrollTo(0,0);
};
window.iyaHome=function(){el("iya-detail").style.display="none";el("iya-home").style.display="block";setTimeout(function(){window.scrollTo(0,scrollY)},0)};
window.iyaRandom=function(){
 var pool=selected?films.filter(function(f){return f.category===selected}):films;
 iyaOpen(pool[Math.floor(Math.random()*pool.length)].id);
};
el("iya-search").addEventListener("input",iyaRender);
el("iya-rating").addEventListener("change",iyaRender);
el("iya-year").addEventListener("change",iyaRender);
iyaRenderCats();iyaRender();
})();
</script>
