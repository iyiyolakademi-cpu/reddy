<meta charset="UTF-8">

<title>5. Sınıf Karma Test</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100%;
}

body{
    min-height:100vh;
}

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:22px 16px 50px;
}

.top{
    margin-bottom:28px;
}

.top h1{
    font-size:22px;
    margin:0 0 8px;
    font-weight:700;
}

.top p{
    color:#8c8c8c;
    font-size:14px;
    margin:0;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    margin-bottom:9px;
    font-size:13px;
    color:#aaa;
}

.progress{
    width:100%;
    height:6px;
    background:#202020;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#fff;
    border-radius:20px;
    transition:.3s;
}

.card{
    background:#0c0c0c;
    border:1px solid #1d1d1d;
    border-radius:18px;
    padding:23px 18px;
}

.category{
    display:inline-block;
    font-size:11px;
    color:#8e8e8e;
    background:#171717;
    padding:6px 9px;
    border-radius:7px;
    margin-bottom:17px;
}

.question{
    font-size:20px;
    line-height:1.5;
    font-weight:600;
    margin-bottom:23px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.option{
    width:100%;
    background:#111;
    color:#fff;
    border:1px solid #292929;
    border-radius:13px;
    padding:15px 14px;
    font-size:15px;
    text-align:left;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    gap:12px;
}

.option:hover:not(:disabled){
    background:#181818;
}

.option-letter{
    width:30px;
    min-width:30px;
    height:30px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#222;
    font-size:13px;
    font-weight:bold;
}

.option.correct{
    border-color:#20c763;
    background:#07150d;
}

.option.correct .option-letter{
    background:#20c763;
    color:#000;
}

.option.wrong{
    border-color:#ff4040;
    background:#190707;
}

.option.wrong .option-letter{
    background:#ff4040;
    color:#fff;
}

.option:disabled{
    cursor:default;
}

.feedback{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:12px;
    font-size:14px;
    line-height:1.6;
}

.feedback.show{
    display:block;
}

.feedback.good{
    background:#07150d;
    color:#38df78;
    border:1px solid #164f2a;
}

.feedback.bad{
    background:#160707;
    color:#ff7373;
    border:1px solid #542020;
}

.feedback-title{
    font-weight:700;
    font-size:16px;
    margin-bottom:6px;
}

.explanation{
    margin-top:8px;
    color:#ddd;
}

.next-btn{
    width:100%;
    margin-top:20px;
    background:#fff;
    color:#000;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    display:none;
}

.next-btn.show{
    display:block;
}

.result{
    display:none;
    text-align:center;
    padding:70px 10px;
}

.result h2{
    font-size:30px;
    margin:0 0 10px;
}

.result .name{
    font-size:25px;
    font-weight:700;
    margin-bottom:35px;
}

.score{
    font-size:55px;
    font-weight:800;
    margin-bottom:8px;
}

.score-text{
    color:#888;
    margin-bottom:30px;
}

.result-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:28px;
}

.stat{
    background:#0c0c0c;
    border:1px solid #1d1d1d;
    border-radius:13px;
    padding:18px 10px;
}

.stat strong{
    display:block;
    font-size:25px;
    margin-bottom:4px;
}

.stat span{
    font-size:12px;
    color:#8f8f8f;
}

.restart{
    width:100%;
    background:#fff;
    color:#000;
    border:0;
    border-radius:12px;
    padding:15px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

@media(max-width:500px){

    .container{
        padding:18px 13px 40px;
    }

    .top h1{
        font-size:20px;

    .card{

    }

    .question{

    }

    .option{
        font-size:14px;
        padding:13px 12px;
    }

    .result h2{
        font-size:25px;
    }

    .result .name{
        font-size:22px;
    }
}
</style>
</head>

let current = 0;
let correct = 0;
let wrong = 0;
let answered = false;

const letters = ["A","B","C","D"];

function loadQuestion(){

    answered = false;

    const q = questions[current];

    document.getElementById("questionNumber").textContent =
        `Soru ${current + 1} / ${questions.length}`;

    document.getElementById("scoreInfo").textContent =
        `${correct} doğru`;

    document.getElementById("category").textContent =
        q.category;

    document.getElementById("question").textContent =
        q.question;

    const progress =
        ((current) / questions.length) * 100;

    document.getElementById("progressFill").style.width =
        progress + "%";

    const options = document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";

        button.innerHTML = `
            <span class="option-letter">${letters[index]}</span>
            <span>${option}</span>
        `;

        button.onclick = ()=>{
            selectAnswer(index);
        };

        options.appendChild(button);

    });

    const feedback = document.getElementById("feedback");

    feedback.className = "feedback";
    feedback.innerHTML = "";

    document.getElementById("nextBtn").className =
        "next-btn";

}


function selectAnswer(selected){

    if(answered) return;

    answered = true;

    const q = questions[current];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(button=>{
        button.disabled = true;
    });

    const feedback =
        document.getElementById("feedback");

    if(selected === q.answer){

        correct++;

        buttons[selected].classList.add("correct");

        feedback.className =
            "feedback show good";

        feedback.innerHTML = `
            <div class="feedback-title">
                Doğru ✓
            </div>
        `;

    }else{

        wrong++;

        buttons[selected].classList.add("wrong");

        buttons[q.answer].classList.add("correct");

        feedback.className =
            "feedback show bad";

        feedback.innerHTML = `
            <div class="feedback-title">
                Yanlış ✕
            </div>

            <div>
                Doğru cevap:
                <strong>
                ${letters[q.answer]}) ${q.options[q.answer]}
                </strong>
            </div>

            <div class="explanation">
                ${q.explanation}
            </div>
        `;

    }

    document.getElementById("scoreInfo").textContent =
        `${correct} doğru`;

    const nextBtn =
        document.getElementById("nextBtn");

    nextBtn.className =
        "next-btn show";

    if(current === questions.length - 1){

        nextBtn.textContent =
            "Testi Bitir";

    }else{

        nextBtn.textContent =
            "Sonraki Soru";

    }

}


function nextQuestion(){

    if(!answered) return;

    if(current < questions.length - 1){

        current++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        showResult();

    }

}


function showResult(){

    document.getElementById("quizArea").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        `${correct}/${questions.length}`;

    document.getElementById("finalCorrect").textContent =
        correct;

    document.getElementById("finalWrong").textContent =
        wrong;

    document.getElementById("progressFill").style.width =
        "100%";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function restartQuiz(){

    current = 0;
    correct = 0;
    wrong = 0;
    answered = false;

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quizArea").style.display =
        "block";

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


loadQuestion();

</script>
